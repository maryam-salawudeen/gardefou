name: Gardefou Privacy and AI Review
description: Reviews pull requests for unsafe AI use and for personal information under Canadian privacy law.
author: Maryam Salawudeen
branding:
  icon: shield
  color: red

inputs:
  github-token:
    description: Token used to read the diff and post comments.
    default: ${{ github.token }}
  ai-provider:
    description: >-
      Which AI checks each rule finding in context and looks for ones the rules missed.
      auto (Claude if anthropic-api-key is set, otherwise rules only), none,
      ollama (free; an Ollama server on the runner, see the README),
      openai-compatible (any OpenAI-compatible server, with ai-url and model), or anthropic.
    default: auto
  anthropic-api-key:
    description: Anthropic API key, for the anthropic provider.
    required: false
  ai-url:
    description: Server URL for ollama (default http://localhost:11434) or openai-compatible.
    required: false
  ai-api-key:
    description: API key for an openai-compatible server, if it needs one.
    required: false
  model:
    description: Model for the AI review. Defaults to qwen2.5-coder:7b for ollama and claude-opus-5-5 for anthropic; required for openai-compatible.
    required: false
  config-path:
    description: Path to the config file.
    default: .gardefou.yml
  fail-on:
    description: Fail the check when a finding at this severity or above remains (high, medium, low or none). Overrides fail_on in the config file.
    required: false
  pia-dir:
    description: Folder where privacy impact assessment drafts are written, for upload as an artifact.
    default: gardefou-pia

outputs:
  findings:
    description: Number of findings.
  high:
    description: Number of high-severity findings.
  pia-dir:
    description: Folder holding PIA drafts, or empty when none were written.

runs:
  using: node20
  main: dist/action.js
